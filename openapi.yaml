components:
  schemas:
    AccessToken:
      type: object
      description: The refresh token is never in a body; it is an HttpOnly cookie
        (accounts.cookies).
      properties:
        access:
          type: string
      required:
      - access
    ApprovedAvatar:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        media_id:
          type: string
          format: uuid
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
        urls:
          allOf:
          - $ref: '#/components/schemas/SignedUrls'
          nullable: true
          readOnly: true
      required:
      - approved_at
      - id
      - media_id
      - urls
    AvailabilityEntry:
      type: object
      properties:
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AvailabilityEntryStatusEnum'
      required:
      - date
      - status
    AvailabilityEntryStatusEnum:
      enum:
      - available
      - tentative
      - unavailable
      type: string
      description: |-
        * `available` - Available
        * `tentative` - Tentative
        * `unavailable` - Unavailable
    AvailabilityWrite:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityEntry'
      required:
      - entries
    AvatarState:
      type: object
      properties:
        avatar:
          allOf:
          - $ref: '#/components/schemas/ApprovedAvatar'
          nullable: true
          description: The current approved photo.
        submission:
          allOf:
          - $ref: '#/components/schemas/AvatarSubmissionOwner'
          nullable: true
          description: 'A newer photo on its way: uploading, in review, or refused.'
      required:
      - avatar
      - submission
    AvatarSubmissionOwner:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        media_id:
          type: string
          format: uuid
          readOnly: true
        stage:
          allOf:
          - $ref: '#/components/schemas/StageEnum'
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
        moderation_reason:
          allOf:
          - $ref: '#/components/schemas/ModerationReasonEnum'
          readOnly: true
        moderation_note:
          type: string
          readOnly: true
        urls:
          allOf:
          - $ref: '#/components/schemas/SignedUrls'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - failure_reason
      - id
      - media_id
      - moderation_note
      - moderation_reason
      - stage
      - urls
    AvatarUpload:
      type: object
      properties:
        content_type:
          type: string
          maxLength: 100
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
      required:
      - content_type
      - size
    AvatarUploadResponse:
      type: object
      properties:
        submission:
          $ref: '#/components/schemas/AvatarSubmissionOwner'
        media_id:
          type: string
          format: uuid
        upload:
          $ref: '#/components/schemas/SignedUpload'
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - media_id
      - submission
      - upload
    BlankEnum:
      enum:
      - ''
    CityOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        state_slug:
          type: string
        state_name:
          type: string
      required:
      - id
      - name
      - slug
      - state_name
      - state_slug
    CraftRef:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
      required:
      - slug
      - title
    Crafts:
      type: object
      properties:
        primary:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        supporting:
          type: array
          items:
            type: string
            pattern: ^[-a-zA-Z0-9_]+$
      required:
      - primary
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/_ErrorBody'
      required:
      - error
    Experience:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 160
        company:
          type: string
          maxLength: 160
        start_year:
          type: integer
          maximum: 32767
          minimum: 0
        end_year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        description:
          type: string
        craft:
          type: string
          readOnly: true
      required:
      - craft
      - id
      - start_year
      - title
    ExperienceCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        company:
          type: string
          maxLength: 160
        start_year:
          type: integer
        end_year:
          type: integer
          nullable: true
        description:
          type: string
          maxLength: 2000
        craft:
          type: string
          nullable: true
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - start_year
      - title
    FailureReasonEnum:
      enum:
      - unsupported_type
      - type_mismatch
      - too_large
      - corrupt
      - too_many_pixels
      - storage_error
      type: string
      description: |-
        * `unsupported_type` - This file type is not supported
        * `type_mismatch` - The file is not the type it claims to be
        * `too_large` - The file is too large
        * `corrupt` - The file could not be read
        * `too_many_pixels` - The image has too many pixels
        * `storage_error` - The file could not be stored
    GalleryItemOwner:
      type: object
      description: 'The owner''s view of an item: everything, plus the derived stage.
        Polled during upload.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          readOnly: true
        media_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        external_url:
          type: string
          format: uri
          readOnly: true
        link_provider:
          allOf:
          - $ref: '#/components/schemas/LinkProviderEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        year:
          type: integer
          readOnly: true
          nullable: true
        craft:
          type: string
          readOnly: true
        position:
          type: integer
          readOnly: true
        stage:
          allOf:
          - $ref: '#/components/schemas/StageEnum'
          readOnly: true
        failure_reason:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/FailureReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        moderation_reason:
          allOf:
          - $ref: '#/components/schemas/ModerationReasonEnum'
          readOnly: true
        moderation_note:
          type: string
          readOnly: true
        submitted_at:
