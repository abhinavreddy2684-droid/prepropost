openapi: 3.0.3
info:
  title: Pre Pro Post API
  version: 0.1.0
paths:
  /api/admin/recruiters:
    get:
      operationId: admin_recruiters_list
      summary: 'Staff: recruiters awaiting review (oldest first)'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - pending
          - rejected
          - unverified
        description: Verification state to list. Defaults to pending.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecruiterReviewList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/admin/recruiters/{profile_id}/approve:
    post:
      operationId: admin_recruiters_approve_create
      summary: 'Staff: approve a pending recruiter'
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterReview'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/admin/recruiters/{profile_id}/reject:
    post:
      operationId: admin_recruiters_reject_create
      summary: 'Staff: reject a pending recruiter with a reason'
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reject'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterReview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: Returns the access token and sets the refresh cookie.
      summary: Exchange email and password for an access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The refresh token as an HttpOnly cookie (name AUTH_REFRESH_COOKIE_NAME,
                default `refresh_token`; Path=/api/auth/; SameSite=Lax; Secure in
                production; max-age = refresh lifetime). It is never in the response
                body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: 'No body. Idempotent: always 204, even with no cookie or an invalid
        one. Access tokens stay valid until they expire.'
      summary: 'Sign out: revoke the refresh cookie''s token and clear the cookie'
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: No body. Reads the refresh cookie, rotates it (the old token is
        blacklisted) and returns a new access token with a rotated cookie. A missing,
        invalid, expired or already used cookie is a 401; a refresh token in the body
        is ignored.
      summary: Get a new access token from the refresh cookie
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The refresh token as an HttpOnly cookie (name AUTH_REFRESH_COOKIE_NAME,
                default `refresh_token`; Path=/api/auth/; SameSite=Lax; Secure in
                production; max-age = refresh lifetime). It is never in the response
                body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/auth/register:
    post:
      operationId: auth_register_create
      description: Returns the access token and sets the refresh cookie.
      summary: Create an account and sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The refresh token as an HttpOnly cookie (name AUTH_REFRESH_COOKIE_NAME,
                default `refresh_token`; Path=/api/auth/; SameSite=Lax; Secure in
                production; max-age = refresh lifetime). It is never in the response
                body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registered'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/auth/resend-verification:
    post:
      operationId: auth_resend_verification_create
      summary: Send the verification email again
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/auth/verify-email:
    post:
      operationId: auth_verify_email_create
      description: 'Credential endpoints: no token needed, tighter scoped throttle
        (set per subclass).'
      summary: Confirm an email address from the link in the verification email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/bootstrap:
    get:
      operationId: bootstrap_retrieve
      description: Public, user-agnostic reference data. Safe for any cache or CDN
        to store.
      summary: 'Reference data: crafts, locations and enums'
      tags:
      - bootstrap
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/gallery-items/{id}/like:
    post:
      operationId: gallery_items_like_create
      summary: Like a public gallery item (idempotent)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gallery-items
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
    delete:
      operationId: gallery_items_like_destroy
      summary: Remove your like (idempotent)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - gallery-items
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/me:
    get:
      operationId: me_retrieve
      summary: The signed-in account and its roles
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/media/{id}/cancel:
    post:
      operationId: media_cancel_create
      description: Only a pending upload can be cancelled; the item waiting on it
        is removed.
      summary: Give up on an upload that has not been confirmed
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaState'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/media/{id}/confirm:
    post:
      operationId: media_confirm_create
      description: |2-

        **Upload sequence** (every media purpose):

        1. Call the domain upload endpoint (e.g. `POST /api/talent/me/gallery/uploads`). It validates
           type, size and quotas and returns `upload` (`url` + `fields`) and `expires_at`.
        2. POST the file to `upload.url` as `multipart/form-data`: every entry of `upload.fields` first,
           then the file as `file`. The bucket enforces the key, the exact `Content-Type` and the size.
        3. When the bucket answers 2xx, call `POST /api/media/{media_id}/confirm` straight away (no user
           action). If the signed form expired first, get a new one from `upload-url`.
        4. A worker validates the real file, strips metadata and makes thumbnails.
        5. Poll the owning item every 2-3 s for its stage:
           uploading -> processing -> under_review -> live, or failed / rejected.

        Only the uploader may confirm. Already confirmed: returns the current state. 409 `upload_missing`: the file is not in storage yet (retry). 410: the upload expired or was removed.
      summary: Confirm that the file reached storage (idempotent)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaState'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/media/{id}/upload-url:
    post:
      operationId: media_upload_url_create
      description: Does not extend `expires_at`. 410 once the upload has expired;
        409 once it has been confirmed.
      summary: A fresh signed upload form for the same pending upload
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/recruiters/me:
    get:
      operationId: recruiters_me_retrieve
      summary: Your recruiter profile, including verification status
      tags:
      - recruiters
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
    post:
      operationId: recruiters_me_create
      summary: Create your recruiter profile (starts unverified)
      tags:
      - recruiters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecruiterCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecruiterCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
    patch:
      operationId: recruiters_me_partial_update
      description: If an approved recruiter changes display_name, company_name, recruiter_type
        or website (ignoring case and surrounding spaces), the profile goes back to
        `pending` review and cannot send offers until approved again. city is cosmetic.
      summary: Update your profile (send only the fields to change)
      tags:
      - recruiters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRecruiterUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRecruiterUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRecruiterUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/recruiters/me/submit:
    post:
      operationId: recruiters_me_submit_create
      summary: Submit your profile for manual review (needs a verified email)
      tags:
      - recruiters
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruiterProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/talent:
    get:
      operationId: talent_list
      description: 'Public: callable with or without a bearer token (an expired or
        invalid token is treated as anonymous, never a 401). Newest profile activity
        first, cursor-paginated (`limit` up to 100, `cursor` from `next`/`previous`).
        Cards carry no private fields. `gender`, `min_age` and `max_age` are restricted:
        401 if you are not signed in, 403 unless you are an approved recruiter; the
        public listing never sends them.'
      summary: Search published talent
      parameters:
      - in: query
        name: available
        schema:
          type: boolean
        description: 'true: not fully booked over the next 7 days. false: fully booked.'
      - in: query
        name: city
        schema:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
        description: City slug. Slugs are unique only within a state; add `state`
          to be exact.
      - in: query
        name: craft
        schema:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
        description: Craft slug. Unknown slugs match nobody.
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: gender
        schema:
          enum:
          - male
          - female
          - non_binary
          - other
          type: string
          minLength: 1
        description: |-
          RESTRICTED to approved recruiters.

          * `male` - Male
          * `female` - Female
          * `non_binary` - Non-binary
          * `other` - Other
      - in: query
        name: genres
        schema:
          type: string
          maxLength: 410
        description: Comma-separated, at most 10. Matches talent with any of them.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: max_age
        schema:
          type: integer
          maximum: 120
          minimum: 0
        description: Years, inclusive. RESTRICTED to approved recruiters.
      - in: query
        name: min_age
        schema:
          type: integer
          maximum: 120
          minimum: 0
        description: Years, inclusive. RESTRICTED to approved recruiters.
      - in: query
        name: primary_craft_only
        schema:
          type: boolean
        description: 'With `craft`: only talent whose primary craft it is.'
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive match on professional name, bio or city name.
      - in: query
        name: state
        schema:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
        description: State slug.
      tags:
      - talent
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTalentCardList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/talent/{id}:
    get:
      operationId: talent_retrieve
      summary: A published talent's public profile
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - talent
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTalent'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/talent/{id}/gallery:
    get:
      operationId: talent_gallery_list
      description: Approved links and approved, processed files only, by position.
        File URLs are signed and short-lived (`urls.expires_at`); fetch again for
        fresh ones.
      summary: A published talent's public gallery
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - talent
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicGalleryItem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/talent/me:
    get:
      operationId: talent_me_retrieve
      summary: Your talent profile, including private fields and completeness
      tags:
      - talent
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateTalent'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
    post:
      operationId: talent_me_create
      summary: 'Start onboarding: create your talent profile'
      tags:
      - talent
      requestBody:
        content:
          application/json:
            schema:
