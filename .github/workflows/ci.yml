name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: prepropost, POSTGRES_PASSWORD: prepropost, POSTGRES_DB: prepropost }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prepropost" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://prepropost:prepropost@localhost:5432/prepropost
      DJANGO_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements/dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }
      - run: pytest
