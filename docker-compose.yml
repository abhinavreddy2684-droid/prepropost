services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prepropost
      POSTGRES_PASSWORD: prepropost
      POSTGRES_DB: prepropost
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepropost"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., args: { REQUIREMENTS: dev } }
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_reference &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., args: { REQUIREMENTS: dev } }
    command: celery -A config worker -l info
    env_file: .env
    volumes: [".:/app"]
    depends_on: [api]

  beat:
    build: { context: ., args: { REQUIREMENTS: dev } }
    command: celery -A config beat -l info
    env_file: .env
    volumes: [".:/app"]
    depends_on: [api]

volumes:
  pgdata:
