services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prepropost
      POSTGRES_PASSWORD: prepropost
      POSTGRES_DB: prepropost
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepropost"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Local stand-in for S3. Credentials and bucket come from .env (see .env.example).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_STORAGE_SECRET_ACCESS_KEY:-change-me-minio-secret}
      # Server-wide CORS: exact frontend origins only (MinIO's default would be "*").
      MINIO_API_CORS_ALLOW_ORIGIN: ${MEDIA_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # One-shot: create the private bucket and apply bucket CORS (POST/GET, expose ETag).
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      ACCESS_KEY: ${MEDIA_STORAGE_ACCESS_KEY_ID:-minioadmin}
      SECRET_KEY: ${MEDIA_STORAGE_SECRET_ACCESS_KEY:-change-me-minio-secret}
      BUCKET: ${MEDIA_STORAGE_BUCKET:-prepropost-media}
      ORIGINS: ${MEDIA_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    volumes: ["./scripts/minio-init.sh:/scripts/minio-init.sh:ro"]
    restart: "no"

  api:
    build: { context: ., args: { REQUIREMENTS: dev } }
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_reference &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., args: { REQUIREMENTS: dev } }
    command: celery -A config worker -l info
    env_file: .env
    volumes: [".:/app"]
    depends_on: [api]

  beat:
    build: { context: ., args: { REQUIREMENTS: dev } }
    command: celery -A config beat -l info
    env_file: .env
    volumes: [".:/app"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
